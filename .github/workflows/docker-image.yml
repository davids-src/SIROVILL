name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  # Lehetőség manuális indításra is
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # A github.repository formátuma: tulajdonos/repo (pl. username/msadmin)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # A GitHub OIDC token-hez kellhet, ha signolást is szeretnél, de alapesetben ez is elég
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Main/master branch push esetén a 'latest' taget is ráteszi
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Kisebb cache-elés a gyorsabb build-hez
          cache-from: type=gha
          cache-to: type=gha,mode=max
